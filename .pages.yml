
media:
  input: media
  output: /media


content:
  - name: posts
    label: Publicações do blog
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Data
        type: date
      - name: body
        label: Texto
        type: rich-text
      - name: video
        label: Link do vídeo
        type: string
